<div class="auth-container">
  <div class="auth-card">
  <h2>Welcome Back</h2>
  <p>Sign in to continue</p>
  <input type="email" [(ngModel)]="user.email" placeholder="Email" class="form-control mb-2">

  <input type="password" [(ngModel)]="user.password" placeholder="Password" class="form-control mb-2">

  <div>
  <button (click)="login()" class="btn btn-primary">Sign In</button>
  </div>

  <p>Don't have an account? <a routerLink="/register">Create Account</a>
  </p>
</div>
</div>
